# OrderClarity Shopify app configuration.
# Client ID is supplied by the owner via Partner Dashboard / CLI. Do not commit secrets.

client_id = ""
name = "OrderClarity"
application_url = "https://example.ngrok.io"
embedded = true

[access_scopes]
scopes = "read_orders,read_products,write_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  topics = ["orders/create", "orders/updated", "orders/cancelled", "app/uninstalled", "app_subscriptions/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[auth]
redirect_urls = ["https://example.ngrok.io/auth/callback"]
